version: '3.8'

services:
  odoo:
    image: odoo:20.0
    container_name: odoo_20
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_addons:/mnt/omnidoc/addons
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/omnidoc/custom_addons
    environment:
      - HOST=odoo-db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: odoo_db_20
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo_data:
  odoo_addons:
  postgres_data: